
name: Group 6 CI/CD Pipeline

# Run the pipeline whenever code is pushed to GitHub.
on:
  push:

jobs:
  # Job 1: Run the unit tests.
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Test the Country class.
      - name: Unit Tests
        run: mvn -Dtest=com.napier.sem.CountryTest test

  # Job 2: Run integration tests using MySQL.
  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Build and start the MySQL database container.
      - name: Start MySQL Database
        run: |
          docker build -t database ./db
          docker run --name world -dp 33060:3306 database

      # Run the integration tests against MySQL.
      - name: Integration Tests
        run: mvn -Dtest=com.napier.sem.AppIntegrationTest test

      # Clean up the database container, even if tests fail.
      - name: Clean Up Docker
        if: always()
        run: |
          docker rm -f world || true

  # Job 3: Package, run and deploy the application.
  build:
    name: Build, Run and Deploy
    runs-on: ubuntu-22.04

    # Build only after both test jobs have passed.
    needs:
      - UnitTests
      - IntegrationTests

    # Allow GitHub Releases to be created.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Package the application as semApp.jar.
      # Tests have already been run in the preceding jobs.
      - name: Package Application
        run: mvn package -DskipTests

      # Start MySQL and execute the application.
      # Use the application's exit code to determine success.
      - name: Run Docker Compose
        run: |
          docker compose up --build \
            --abort-on-container-exit \
            --exit-code-from app

      # Clean up containers whether execution passes or fails.
      - name: Clean Up Docker Compose
        if: always()
        run: docker compose down

      # Publish the JAR as a GitHub Release.
      # Releases are created only when code reaches main.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create \
            "build-${{ github.run_number }}" \
            ./target/semApp.jar \
            --title "Group 6 Build ${{ github.run_number }}" \
            --generate-notes \
            --target "${{ github.sha }}"
