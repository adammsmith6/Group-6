name: A workflow for our group project

# Run the workflow whenever code is pushed to GitHub.
on: push

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      # Run all JUnit unit tests.
      - name: Unit Tests
        run: mvn -Dtest=com.napier.sem.CountryTest test

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Integration Tests
        run: |
          docker build -t database ./db 
          docker run --name world -dp 33060:3306 database
          mvn -Dtest=com.napier.sem.AppIntegrationTest test
          docker stop world
          docker rm world
          docker image rm database 

  build:
    name: Build and Test Application
    runs-on: ubuntu-22.04

    steps:
      # Checkout the repository and its submodules.
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # Install Java 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Package the application without running the tests again.
      # Then start the application and database using Docker Compose.
      - name: Package and Run Docker Compose
        run: |
          mvn package -DskipTests
          docker compose up --abort-on-container-exit