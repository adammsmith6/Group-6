name: A workflow for our group project

# Run this workflow whenever code is pushed to GitHub.
on: push

jobs:
  build:
    name: Build and Test Application
    runs-on: ubuntu-22.04

    steps:
      # Checkout the repository and its submodules.
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # Install Java 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Compile the application and run Maven tests.
      - name: Build with Maven
        run: mvn clean package

      # Build and start the application and database containers.
      - name: Start Docker Compose
        run: docker compose up --build -d

      # Display the status of the Docker containers.
      - name: Check container status
        run: docker compose ps

      # Display the application output.
      # This allows us to check whether the database connection
      # and population report were successful.
      - name: View application logs
        run: docker compose logs app